<div [ngClass]="{ 'feedback-container': true, none: info.variant === 'none' }">
    <div [ngSwitch]="info.variant">
        <mat-icon class="icon" *ngSwitchCase="'http'" fontIcon="wifi_off"></mat-icon>
        <mat-icon
            class="icon"
            *ngSwitchCase="'empty'"
            fontIcon="playlist_remove"
        ></mat-icon>
        <mat-icon class="icon" *ngSwitchCase="'error'" fontIcon="error"></mat-icon>
        <mat-spinner *ngSwitchCase="'loading'" fontIcon="sync"></mat-spinner>
        <div *ngSwitchDefault></div>
    </div>
    <h2 *ngIf="info.title">{{ info.title }}</h2>
    <p *ngIf="info.description">{{ info.description }}</p>
    <btn
        *ngIf="info.action && info.variant !== 'loading'"
        (onClick)="info.action()"
        variant="primary"
    >
        <h5>{{ info.actionLabel }}</h5>
    </btn>
</div>
