<div class="group" #status [formControl]="formController" ngDefaultControl>
    <button
        *ngFor="let item of items"
        (click)="onClick(item)"
        [ngClass]="[isEqual(item) ? 'button-primary' : 'button-outlined']"
        [value]="item"
        [disabled]="disabled"
    >
        <mat-icon *ngIf="isEqual(item)" class="icon material-symbols-outlined"
            >check
        </mat-icon>
        {{ item.label }}
    </button>
</div>
