<div class="bank">
    <div class="savings-container lvi label-value">
        <mat-icon
            class="material-symbols-outlined"
            aria-hidden="false"
            aria-label="icon"
            fontIcon="local_atm"
        ></mat-icon>
        <p>bank savings</p>
        <h1>{{bank.savings | currency: "R$ "}}</h1>
    </div>
</div>
<div class="month-savings label-value">
    <mat-icon
        class="material-symbols-outlined"
        aria-hidden="false"
        aria-label="icon"
        fontIcon="savings"
    ></mat-icon>
    <p>month savings</p>
</div>
<savings-template [bank]="bank" />
