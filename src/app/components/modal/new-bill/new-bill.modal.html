<modal-component
    [disabled]="onDisableButton()"
    header="new bill"
    (actionPrimary)="step !== 4 ? onNextStep() : onSubmit()"
    (actionSecondary)="step !== 1 ? onPreviousStep() : handleClose()"
    [bodyTemplate]="newBill"
></modal-component>

<ng-template #newBill>
    <form [formGroup]="billForm">
        <ng-container *ngIf="step === 1">
            <type-template
                [type]="billForm.getRawValue().type"
                (setType)="setType($event)"
            />
        </ng-container>
        <ng-container *ngIf="step === 2">
            <info-template
                [type]="billForm.get('type')!.value"
                [nameControl]="billForm.controls['name']"
                [descriptionControl]="billForm.controls['description']"
                [totalControl]="billForm.controls['total']"
                [categoryControl]="billForm.controls['category']"
            />
        </ng-container>
        <ng-container *ngIf="step === 3 && billForm.value.type === 'money'">
            <template-banks
                [bank1Control]="billForm.controls['bank1']"
                [bank2Control]="billForm.controls['bank2']"
                [isPaymentControl]="billForm.controls['isPayment']"
                [companyControl]="billForm.controls['category']"
            />
        </ng-container>
        <ng-container *ngIf="step === 3 && billForm.value.type === 'companyCredit'">
            <template-companies
                [compData]="getCompanyForm()"
                [compDataErrors]="getErrorCompanyForm()"
                (setCompData)="onPatch($event)"
            />
        </ng-container>
        <ng-container *ngIf="step === 3 && billForm.value.type === 'creditCard'">
            <template-credit-card
                [creditCardData]="getCreditCardForm()"
                [creditCardDataErrors]="getErrorCreditCardForm()"
                (setCreditCardData)="onPatch($event)"
            />
        </ng-container>
        <ng-container *ngIf="step === 4">
            <template-config
                [configData]="getConfigForm()"
                (setConfigData)="onPatch($event)"
            />
        </ng-container>
    </form>
</ng-template>
