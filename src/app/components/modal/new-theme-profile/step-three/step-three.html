<div class="form">
    <card-component [hideHeader]="true">
        <div class="font">
            <h5 [style.fontFamily]="font1.value">font 1</h5>
            <toggle-button variant="outlined" [items]="fonts" [formController]="font1" />
        </div>
    </card-component>
    <card-component [hideHeader]="true">
        <div class="font">
            <h5 [style.fontFamily]="font2.value">font 2</h5>
            <toggle-button variant="outlined" [items]="fonts" [formController]="font2" />
        </div>
    </card-component>
    <card-component [hideHeader]="true">
        <toggle-button
            label="padding"
            variant="outlined"
            [items]="paddingMeasures"
            [formController]="padding"
        />
    </card-component>
    <card-component [hideHeader]="true">
        <toggle-button
            label="input size"
            variant="outlined"
            [items]="inputSizeMeasures"
            [formController]="inputSize"
        />
    </card-component>
    <card-component [hideHeader]="true">
        <toggle-button
            label="border width"
            variant="outlined"
            [items]="borderWidthMeasures"
            [formController]="borderWidth"
        />
    </card-component>
    <card-component [hideHeader]="true">
        <div class="input">
            <h5>border radius</h5>
            <mat-form-field appearance="outline">
                <mat-icon
                    class="material-symbols-outlined"
                    matPrefix
                    aria-hidden="false"
                    aria-label="title icon"
                    fontIcon="rounded_corner"
                ></mat-icon>
                <input [formControl]="borderRadius" matInput type="number" />
                @if (borderRadius.status === 'INVALID') {
                <mat-error>{{invalidError}}</mat-error>
                }
            </mat-form-field>
        </div>
    </card-component>
</div>
