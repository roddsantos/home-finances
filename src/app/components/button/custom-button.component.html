<button
    [id]="'custom-button-' + id"
    (click)="handleClick()"
    [ngClass]="[
        'main',
        'button-' + variant,
        extended ? 'extended' : '',
        textColor,
        classes
    ]"
    [style.color]="setTextColor()"
    mat-button
>
    <ng-content></ng-content>
</button>
