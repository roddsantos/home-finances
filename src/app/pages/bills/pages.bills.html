<div class="bills">
    <div class="bills-header">
        <h1 class="page-title">bills</h1>
        <button
            aria-label="bills list visualization"
            matTooltip="list visualization"
            matTooltipPosition="above"
            mat-button
            [ngClass]="[(billState.billVisualization$ | async) === 'list' ? 'button-primary' : 'button-secondary']"
            [style.margin]="'auto 0.5rem auto auto'"
            (click)="billState.changeVisualization('list')"
        >
            <mat-icon class="material-symbols-outlined">view_list</mat-icon>
        </button>
        <button
            aria-label="bills grid visualization"
            matTooltip="grid visualization"
            matTooltipPosition="above"
            mat-button
            [style.margin]="'auto 0px auto 0px'"
            [ngClass]="[(billState.billVisualization$ | async) === 'grid' ? 'button-primary' : 'button-secondary']"
            (click)="billState.changeVisualization('grid')"
        >
            <mat-icon class="icon material-symbols-outlined">grid_view</mat-icon>
        </button>

        <pagination-template [style.margin]="'auto 0px auto 1rem'"></pagination-template>
        <button
            *ngIf="!(generalState.filterContainer$ | async)"
            aria-label="open filter selector"
            matTooltip="filter selector"
            matTooltipPosition="above"
            mat-button
            [ngClass]="['button-primary']"
            [style.margin]="'auto 0px auto 10px'"
            (click)="openFilterContainer()"
        >
            <mat-icon class="filter-icon material-symbols-outlined">filter_alt</mat-icon>
            <p>open filters</p>
        </button>
    </div>
    <div [ngClass]="['bill-container', billState.billVisualization$ | async]">
        <div class="bill-list-container">
            <feedback-container
                [style.width]="'100%'"
                *ngIf="(billState.bills$| async)?.length === 0"
                [info]="(billState.status$ | async)!"
            ></feedback-container>
            <div
                [ngClass]="['bill-list', billState.billVisualization$ | async]"
                *ngIf="(billState.bills$| async)!.length > 0"
            >
                <ng-template
                    ngFor
                    let-item
                    [ngForOf]="(billState.bills$ | async)"
                    let-i="index"
                    [ngForTrackBy]="trackByFn"
                >
                    <bank-list-template
                        [ngClass]="['bill-item', isLineTheme]"
                        *ngIf="item.type === 'money'"
                        [data]="item"
                    ></bank-list-template>
                    <credit-card-list-template
                        [ngClass]="['bill-item', isLineTheme]"
                        *ngIf="item.type === 'creditCard'"
                        [data]="item"
                    ></credit-card-list-template>
                    <service-list-template
                        [ngClass]="['bill-item', isLineTheme]"
                        *ngIf="item.type === 'companyCredit'"
                        [data]="item"
                    ></service-list-template>
                </ng-template>
            </div>
            <custom-filter></custom-filter>
        </div>
    </div>
</div>
