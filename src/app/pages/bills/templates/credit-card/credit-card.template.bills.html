<div class="bill-tags">
    <tag
        [id]="'tag-credit-card-'+data.id"
        theme="var(--credit-card)"
        matTooltip="credit card"
        transform
    >
        <mat-icon
            class="material-symbols-outlined type-icon"
            aria-hidden="false"
            aria-label="icon"
            fontIcon="credit_card"
        ></mat-icon>
        <p class="type-name">{{data.creditCard?.name}}</p>
    </tag>
    <tag
        [id]="'tag-category-'+data.id"
        matTooltip="category"
        [theme]="data.category.color"
        transform
    >
        <mat-icon
            class="material-icons-outlined category-icon"
            aria-hidden="false"
            aria-label="icon"
            [fontIcon]="data.category.icon"
        ></mat-icon>
        <p class="category-name">{{data.category.name}}</p>
    </tag>
    <tag
        matTooltip="recurrent bill"
        [id]="'tag-recurrent-'+data.id"
        theme="var(--info)"
        transform
        [ngClass]="['recurrent-container',  data.isRecurrent ? 'recurrent' : '']"
    >
        <mat-icon
            class="material-symbols-outlined"
            aria-hidden="false"
            aria-label="icon"
            fontIcon="cycle"
        ></mat-icon>
    </tag>
</div>
