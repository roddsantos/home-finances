<div
    [ngClass]="['bill-container-item', billState.billVisualization$ | async]"
    (click)="openDetails(data, $event)"
>
    <div class="bill-tags">
        <div [ngClass]="['type-container', 'credit-card', isLineTheme]">
            <mat-icon
                class="material-symbols-outlined type-icon"
                aria-hidden="false"
                aria-label="icon"
                fontIcon="credit_card"
            ></mat-icon>
            <p class="type-name">{{data.creditCard?.name}}</p>
        </div>
        <div [ngClass]="['category-container','credit-card', isLineTheme]">
            <mat-icon
                class="material-symbols-outlined category-icon"
                aria-hidden="false"
                aria-label="icon"
                [fontIcon]="data.category.icon"
            ></mat-icon>
            <p class="category-name">{{data.category.name}}</p>
        </div>
    </div>
    <actions
        class="bill-buttons"
        [vertical]="(billState.billVisualization$ | async) === 'grid'"
        [transparent]="false"
        [data]="data"
        [actions]="actions"
    ></actions>
    <h3 class="title">{{ data.name }}</h3>
    <p class="description">{{ data.description }}</p>
    <div [ngClass]="['date-container', dateLeft, isLineTheme]">
        <mat-icon
            class="material-symbols-outlined date-icon"
            aria-hidden="false"
            aria-label="icon"
            fontIcon="event"
        ></mat-icon>
        <p>{{(data.settled ? data.paid : data.due) | date: "mediumDate"}}</p>
    </div>
    <div class="value-container">
        <div class="parcel">
            <p>{{data.parcel + 1}}</p>
            <h5>{{"/" + data.parcels}}</h5>
        </div>
        <p class="value">{{data.totalParcel | currency: "R$ "}}</p>
    </div>
</div>
