<div class="bill-tags">
    <div
        [matTooltip]="data.isPayment ? 'outcome' : 'income'"
        [ngClass]="['tag', 'flow-container', data.isPayment ? 'outcome' : 'income']"
    >
        <mat-icon
            class="material-symbols-outlined type-icon"
            aria-hidden="false"
            aria-label="icon"
            [fontIcon]="data.isPayment ? 'arrow_circle_up' : 'arrow_circle_down'"
        ></mat-icon>
    </div>
    <tag [id]="'tag-type-'+data.id" theme="var(--bank)" transform>
        <mat-icon
            class="material-symbols-outlined type-icon"
            aria-hidden="false"
            aria-label="icon"
            fontIcon="payments"
        ></mat-icon>
        <p class="type-name">{{data.bank1?.name}}</p>
    </tag>
    <!-- <div matTooltip="bank" [ngClass]="['type-container', 'tag', 'bank', isLineTheme]">
        <mat-icon
            class="material-symbols-outlined type-icon"
            aria-hidden="false"
            aria-label="icon"
            fontIcon="payments"
        ></mat-icon>
        <p class="type-name">{{data.bank1?.name}}</p>
    </div> -->
    <div
        matTooltip="category"
        [ngClass]="['category-container','tag','bank', isLineTheme]"
    >
        <mat-icon
            class="material-icons-outlined category-icon"
            aria-hidden="false"
            aria-label="icon"
            [fontIcon]="data.category.icon"
        ></mat-icon>
        <p class="category-name">{{data.category.name}}</p>
    </div>
    <div
        matTooltip="recurrent bill"
        [ngClass]="['recurrent-container','tag', isLineTheme, data.isRecurrent ? 'recurrent' : '']"
    >
        <mat-icon
            class="material-symbols-outlined"
            aria-hidden="false"
            aria-label="icon"
            fontIcon="cycle"
        ></mat-icon>
    </div>
</div>
