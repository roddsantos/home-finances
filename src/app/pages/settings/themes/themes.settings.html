<card-component
    id="themes"
    title="themes"
    description="choose a theme for the application"
>
    <div class="themes grid">
        <div
            class="theme-container"
            *ngFor="let th of themes"
            (click)="clickedTheme(th)"
            [ngClass]="{
                  'theme-container': true,
                  selected: selectedTheme === th.id
                }"
        >
            <h4>{{th.title}}</h4>
            <p>{{th.description}}</p>
            <div class="theme-pallete">
                <div
                    class="pallete-color"
                    [style.backgroundColor]="th['--primary']"
                ></div>
                <div
                    class="pallete-color"
                    [style.backgroundColor]="th['--secondary']"
                ></div>
                <div class="pallete-color" [style.backgroundColor]="th['--third']"></div>
                <div
                    class="pallete-color"
                    [style.backgroundColor]="th['--background']"
                ></div>
            </div>
        </div>
    </div>
</card-component>
