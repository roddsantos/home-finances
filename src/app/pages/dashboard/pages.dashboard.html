<div class="dashboard">
    <h1 class="page-title">dashboard</h1>
    <div class="dashboard-container">
        <card-component
            id="dashboard-month-span"
            class="dashboard-month-span"
            [title]="'monthly bills - ' + ((this.dashboardState.monthSpan$ | async) === 1 ? 'this month' : (this.dashboardState.monthSpan$ | async) + ' months')"
            [border]="true"
        >
            <div class="content">
                <canvas id="bills-per-month" class="bills-per-month" height="200"
                    >{{billsPerMonthChart}}</canvas
                >
                <div class="bill-progression">
                    <h3>month progression</h3>
                    <div class="grid-content">
                        <div
                            class="item"
                            *ngFor="let bill of (this.dashboardState.billsCounters$ | async) as bills; let i = index"
                        >
                            <p class="month">{{ months[bills[i].month].short }}</p>
                            <mat-icon
                                class="material-symbols-outlined icon"
                                [ngClass]="[i + 1 === bills.length || bills[i + 1].total === 0 ? 'blue' : bills[i].total - bills[i + 1].total < 0 ? 'green' : 'red']"
                                [fontIcon]="i + 1 === bills.length || bills[i + 1].total === 0 ? 'trending_flat' : bills[i].total - bills[i + 1].total < 0 ? 'trending_down' : 'trending_up'"
                            ></mat-icon>
                            <h5
                                class="percentage"
                                [ngClass]="[i + 1 === bills.length ? 'blue' : bills[i].total - bills[i + 1].total < 0 ? 'green' : 'red']"
                            >
                                {{ i + 1 === bills.length || bills[i + 1].total === 0 ? 0
                                : ((bills[i].total / bills[i + 1].total - 1) *
                                100).toFixed(2) }}%
                            </h5>
                        </div>
                    </div>
                </div>
            </div>
            <div class="dashboard-indicator" (click)="handleMonthSpan()">
                <mat-icon
                    class="material-symbols-outlined icon"
                    [fontIcon]="'date_range'"
                ></mat-icon>
                <mat-icon
                    class="material-symbols-outlined icon"
                    [fontIcon]="'counter_'+ (this.dashboardState.monthSpan$ | async)"
                ></mat-icon>
            </div>
        </card-component>
        <card-component
            id="dashboard-categories"
            class="dashboard-categories"
            [title]="'bills per category'"
            [border]="true"
        >
            <canvas id="categories-chart" class="categories-chart"></canvas>
        </card-component>
        <card-component
            id="dashboard-calendar"
            class="dashboard-calendar"
            [title]="'bill calendar - ' + month.name.toLowerCase()"
            [border]="true"
        >
            <calendar-component
                [key]="'due'"
                [events]="(dashboardState.monthBills$ | async) || []"
            />
        </card-component>
        <card-component
            id="dashboard-3"
            class="dashboard-3"
            [title]="'dashboard-3'"
            [border]="true"
        >
        </card-component>
        <card-component
            id="dashboard-savings"
            class="dashboard-savings"
            [title]="'savings'"
            [border]="true"
        >
            <div class="savings-container">
                <canvas height="200" id="savings-chart" class="savings-chart"
                    >{{savingsChart}}</canvas
                >
            </div>
        </card-component>
    </div>
</div>
